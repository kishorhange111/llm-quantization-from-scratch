[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-quantization-from-scratch"
version = "0.1.0"
description = "LLM post-training quantisation from scratch on GPT-2: RTN, GPTQ (Hessian + Cholesky, lazy batch updates, act-order), AWQ activation-aware scaling and SmoothQuant W8A8, measured on perplexity and layer reconstruction error."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kishor Hange" }]
dependencies = ["torch>=2.2", "numpy>=1.26", "transformers>=4.40"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E741", "E731"]
